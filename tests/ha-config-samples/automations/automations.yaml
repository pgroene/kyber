    clean_queue:
      '[object Object]':
    next_clean_id:
    next_clean_row: "{% if states('input_text.badkamer').split(\",\")[1] == next_clean_id
      %} \n  {{ states('input_text.badkamer').split(',') }}\n{% elif states('input_text.slaapkamer').split(\",\")[1]
      == next_clean_id %} \n    {{ states('input_text.slaapkamer').split(',') }}\n{%
      elif states('input_text.eetkamer').split(\",\")[1] == next_clean_id %} \n    {{
      states('input_text.eetkamer').split(',') }}\n{% elif states('input_text.eetkamer2').split(\",\")[1]
      == next_clean_id %} \n    {{ states('input_text.eetkamer2').split(',') }}\n{%
      elif states('input_text.hall').split(\",\")[1] == next_clean_id %} \n    {{
      states('input_text.hall').split(',') }}\n{% elif states('input_text.entree').split(\",\")[1]
      == next_clean_id %} \n    {{ states('input_text.entree').split(',') }}\n{% elif
      states('input_text.zitkamer').split(\",\")[1] == next_clean_id %} \n    {{ states('input_text.zitkamer').split(',')
      }}\n{% elif states('input_text.speelkamer').split(\",\")[1] == next_clean_id
      %} \n    {{ states('input_text.speelkamer').split(',') }}\n{% elif states('input_text.werkkamer').split(\",\")[1]
      == next_clean_id %} \n    {{ states('input_text.werkkamer').split(',') }}\n{%
      elif states('input_text.keuken').split(\",\")[1] == next_clean_id %} \n    {{
      states('input_text.keuken').split(',') }}\n{% endif%}\n"
    next_clean_script: vacuum_kitchen
  mode: single
