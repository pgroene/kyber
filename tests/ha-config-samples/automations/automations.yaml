- id: '1714771228842'
  alias: Weather aware lights ON OFF
  description: ''
  trigger:
  - platform: sun
    event: sunset
    offset: 00:05:00
    id: Sunny
  - platform: sun
    event: sunset
    offset: -00:15:00
    id: Cloudy
  - platform: sun
    event: sunset
    offset: -00:30:00
    id: Rainy
  - platform: sun
    event: sunset
    offset: -01:00:00
    id: Darky
  - platform: time
    at: '21:30:00'
    id: 'Off'
  condition:
  - condition: template
    value_template: '{{ ((is_state(''weather.forecast_thuis'', ''sunny'')  or is_state(''weather.forecast_thuis'',
      ''clear-night'')  or is_state(''weather.forecast_thuis'', ''windy'')  or is_state(''weather.forecast_thuis'',
      ''windy-variant'')) and ( trigger.id == ''Sunny'')) or ((is_state(''weather.forecast_thuis'',
      ''fog'')  or is_state(''weather.forecast_thuis'', ''partlycloudy'') or is_state(''weather.forecast_thuis'',
      ''cloudy'')) and ( trigger.id == ''Cloudy'')) or ((is_state(''weather.forecast_thuis'',
      ''pouring'')  or is_state(''weather.forecast_thuis'', ''rainy'')  or is_state(''weather.forecast_thuis'',
      ''snowy-rainy'')  or is_state(''weather.forecast_thuis'', ''lightning'')  or
      is_state(''weather.forecast_thuis'', ''hail'')  or is_state(''weather.forecast_thuis'',
      ''lightning-rainy'')) and ( trigger.id == ''Rainy''))  or (is_state(''weather.forecast_thuis'',
      ''exceptional'') and ( trigger.id == ''Badly''))  or ( trigger.id == ''Off'')
      }}'
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Sunny
        - Cloudy
        - Rainy
        - Darky
      sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.onoff_407_front_yard
        data: {}
    - conditions:
      - condition: trigger
        id:
        - 'Off'
      sequence:
      - service: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: switch.onoff_407_front_yard
  mode: single
- id: '1716700058875'
  alias: Clean house when AWAY
  description: ''
  trigger:
  - platform: state
