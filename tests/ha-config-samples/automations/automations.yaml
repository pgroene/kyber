- id: '1683404027401'
  alias: Toggle disco lobke light
  description: ''
  trigger:
  - device_id: 548093d8828388dd93bb677c3b788384
    domain: zha
    platform: device
    type: remote_button_long_press
    subtype: right
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.test_timer
    id: timer
  condition: []
  action:
  - parallel:
    - service: light.turn_on
      data_template:
        entity_id: light.light_led_adapter_1_lobke_light
        hs_color:
        - '{{(states.light.light_led_adapter_1_light.attributes.hs_color[0] + 10)
          % 360}}'
        - 100
        transition: 30
    - service: light.turn_on
      data_template:
        entity_id: light.light_lobke_bed
        hs_color:
        - '{{(states.light.light_led_adapter_1_light.attributes.hs_color[0] + 10 +
          180) % 360}}'
        - 100
        transition: 30
  - service: timer.start
    target:
      entity_id: timer.test_timer
    data:
      duration: 180
  mode: single
