pomp_cycle_script:
  alias: Pomp Cycle Script
  description: Runs the pomp in cycles with a wait time and controls switch off.
  fields:
    cycles:
      description: Number of cycles to run
      example: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
      required: true
    runtime:
      description: Runtime per cycle (seconds)
      example: 600
      selector:
        number:
          min: 30
          max: 3000
          step: 30
      required: true
  sequence:
  - data:
      entity_id: input_boolean.irrigation_pump
    action: input_boolean.turn_on
  - target:
      entity_id: switch.onoff_pomp_410
    action: switch.turn_on
    data: {}
    enabled: true
  - delay:
      seconds: 1
  - target:
      entity_id: number.onoff_pomp_410_countdown
    data:
      value: '{{ runtime | float }}'
    action: number.set_value
  - repeat:
      count: '{{ (cycles | int) - 1 }} '
      sequence:
      - delay:
          seconds: '{{ runtime | float }}'
      - delay:
          seconds: '{{ runtime | float }}'
      - target:
          entity_id: switch.onoff_pomp_410
        action: switch.turn_on
        data: {}
      - delay:
          seconds: 1
      - target:
          entity_id: number.onoff_pomp_410_countdown
        data:
          value: '{{ runtime | float }}'
        action: number.set_value
  - delay:
      seconds: '{{ runtime | float }}'
  - data: {}
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.irrigation_pump
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.onoff_pomp_410
  mode: restart
