test_signal_when_action_is_complete:
  alias: signal_zitkamer
  description: ''
  variables:
    light_color: blue
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.home_presence
      state: 'on'
    then:
    - data:
        scene_id: saved_lights_state
        entities: {}
        snapshot_entities:
        - light.group_alert_lights
      action: scene.create
    - data:
        transition: 1
        brightness_pct: 100
        color_name: '{{ light_color }}'
      target:
        entity_id:
        - light.group_alert_lights
      action: light.turn_on
    - delay:
        hours: 0
        minutes: 0
        seconds: 3
    - action: light.turn_on
      metadata: {}
      data:
        effect: blink
      target:
        entity_id: light.group_alert_lights
    - delay:
        hours: 0
        minutes: 0
        seconds: 3
    - data:
        transition: 2
      target:
        entity_id: scene.saved_lights_state
      action: scene.turn_on
    else:
    - delay:
        hours: 0
        minutes: 0
        seconds: 3
  mode: single
