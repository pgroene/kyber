'1717681909594':
  alias: Vacuum queue manager
  sequence:
  - variables:
      current_list: '{{ states(''input_text.vacuum_queue'').split('','') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{  mode == ''Remove'' }}'
      sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.vacuum_queue
        data:
          value: '{{ (current_list | reject(''equalto'', number|string) | list) |
            join('','') }}'
    - conditions:
      - condition: template
        value_template: '{{ states(''input_text.vacuum_queue'') == '''' }}'
      sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.vacuum_queue
        data:
          value: '{{ number }}'
    - conditions:
      - condition: template
        value_template: '{{ number not in current_list }}'
      sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.vacuum_queue
        data:
          value: '{{ states(''input_text.vacuum_queue'') ~ '','' ~ number }}'
    - conditions:
      - condition: template
        value_template: '{{ number|string == current_list[0] }}'
      sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.vacuum_queue
        data:
          value: '{{ current_list[1:] | join('','') }}'
    - conditions:
      - condition: template
        value_template: '{{ number in current_list }}'
      sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.vacuum_queue
        data:
          value: '{{ ([number|string] + (current_list | reject(''equalto'', number|string)
            | list)) | join('','') }}'
  fields:
    number:
      description: The number to append
      required: true
    mode:
      description: Add or Remove
      required: true
  mode: queued
