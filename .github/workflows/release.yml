name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Update CHANGELOG and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update CHANGELOG.md
        run: python scripts/update_changelog.py ${{ github.ref_name }}

      - name: Commit updated CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update CHANGELOG for ${{ github.ref_name }} [skip ci]"
          git push origin main

      - name: Extract release notes
        run: |
          python - <<'EOF'
          import re, sys
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          # Match the section for this exact version
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, changelog, re.DOTALL)
          notes = m.group(1).strip() if m else f"Release {tag}"
          open("/tmp/release_notes.md", "w", encoding="utf-8").write(notes)
          print("Release notes written.")
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Kyber ${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md
