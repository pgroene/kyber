name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'EOF'
          import re
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          # Match the section for this exact version
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, changelog, re.DOTALL)
          notes = m.group(1).strip() if m else f"Release {tag}"
          open("/tmp/release_notes.md", "w", encoding="utf-8").write(notes)
          print("Release notes written.")
          print(notes[:200])
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Kyber ${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md
